[workspace]
members = [
	"crates/use-rust",
	"crates/use-rust-cargo",
	"crates/use-crate",
	"crates/use-version",
	"crates/use-rust-release",
]
resolver = "2"

[workspace.package]
authors = ["RustUse Contributors"]
edition = "2024"
homepage = "https://rustuse.org"
license = "MIT OR Apache-2.0"
publish = false
readme = "README.md"
repository = "https://github.com/RustUse/use-rust"
rust-version = "1.95.0"
version = "0.1.1"

[workspace.dependencies]
camino = { version = "1.1", features = ["serde1"] }
cargo_metadata = "0.19"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
toml_edit = "0.22"

[workspace.metadata.rustuse.release]
publish = false
versioning = "lockstep-0.x"
first-publish-candidates = [
	"use-version",
	"use-crate",
	"use-rust",
	"use-rust-cargo",
	"use-rust-release",
]
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
expect_used = "warn"
multiple_crate_versions = "allow"
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
todo = "deny"
unimplemented = "deny"
unwrap_used = "warn"
